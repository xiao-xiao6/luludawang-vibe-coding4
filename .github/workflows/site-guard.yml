name: site-guard

# 站点守卫
#
# 【2026-09-23 策略变更】单人模式改走「本地真汤底」：
#   汤库数据（含 truth）**明文公开**、随站点发布，供任何人查阅与下载。
#   防作弊交给玩家自觉 —— 汤面本身网上也搜得到，藏汤底拦不住真想作弊的人，
#   只会拦住正常玩的人（AI 汤主拿不到真底 → 空底瞎编）。
#   多人房判定仍在服务端 Worker，不受影响。
#
# 因此本守卫的职责改为：
#   1) 内部数据管线源文件（data/library/）不得进仓库；
#   2) 服务端生成题库（worker/src/*.data.js）不得进仓库；
#   3) 公开汤库档（js/library.public.js）结构自检：题量、汤底落地、必须可当普通脚本加载。

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 内部数据源不得被跟踪
        run: |
          if git ls-files --error-unmatch "data/library" > /dev/null 2>&1; then
            echo "::error::data/library/ 下的内部数据源被 Git 跟踪了，必须从仓库移除并加进 .gitignore"
            git ls-files "data/library"
            exit 1
          fi
          if git ls-files | grep -q "worker/src/.*\.data\.js$"; then
            echo "::error::服务端生成题库（worker/src/*.data.js）不得进仓库，应只存在于部署环境"
            git ls-files | grep "worker/src/.*\.data\.js$"
            exit 1
          fi
          echo "✓ 仓库未跟踪任何内部数据源"

      - name: 公开汤库档结构自检
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("js/library.public.js", "utf8");
            if (!/hasTruth/.test(s)) { console.error("::error::js/library.public.js 缺少 hasTruth 标记"); process.exit(1); }
            const n = (s.match(/\{"id":/g) || []).length;
            /* 阈值留余量：当前题库 ~988 题，瘦到 900 以下才算异常 */
            if (n < 900) { console.error("::error::js/library.public.js 题量异常：" + n); process.exit(1); }
            const t = (s.match(/"hasTruth":true/g) || []).length;
            if (t < 900) { console.error("::error::js/library.public.js 汤底缺失：只有 " + t + " 条带底（单人模式会退化成空底瞎编）"); process.exit(1); }
            if (/^\s*export\s/m.test(s)) { console.error("::error::js/library.public.js 不能是 ES module：它是 index.html 用 <script src> 直接加载的普通脚本"); process.exit(1); }
            console.log("✓ js/library.public.js 结构正常（" + n + " 条，含汤底 " + t + " 条，明文公开）");
          '
