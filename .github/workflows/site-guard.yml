name: site-guard

# 站点守卫
#
# 【2026-09-23 策略变更】单人模式改走「本地真汤底」：
#   汤库数据（含 truth）**明文公开**、随站点发布，供任何人查阅与下载。
#   防作弊交给玩家自觉 —— 汤面本身网上也搜得到，藏汤底拦不住真想作弊的人，
#   只会拦住正常玩的人（AI 汤主拿不到真底 → 空底瞎编）。
#   多人房判定仍在服务端 Worker，不受影响。
#
# 因此本守卫的职责改为：
#   1) 内部数据管线源文件（data/library/）不得进仓库；
#   2) 服务端生成题库（worker/src/*.data.js）不得进仓库；
#   3) 公开汤库档（js/library.public.js）结构自检：题量、汤底落地、必须可当普通脚本加载。

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 内部数据源不得被跟踪
        run: |
          if git ls-files --error-unmatch "data/library" > /dev/null 2>&1; then
            echo "::error::data/library/ 下的内部数据源被 Git 跟踪了，必须从仓库移除并加进 .gitignore"
            git ls-files "data/library"
            exit 1
          fi
          if git ls-files | grep -q "worker/src/.*\.data\.js$"; then
            echo "::error::服务端生成题库（worker/src/*.data.js）不得进仓库，应只存在于部署环境"
            git ls-files | grep "worker/src/.*\.data\.js$"
            exit 1
          fi
          echo "✓ 仓库未跟踪任何内部数据源"

      - name: 公开汤库档结构自检
        run: |
          node -e '
            const fs = require("fs");
            const vm = require("vm");
            const s = fs.readFileSync("js/library.public.js", "utf8");
            /* 这条文件是 index.html 用 <script src> 直接加载的普通脚本，
               不能是 ES module —— 先卡这一条，再用沙箱把它真跑一遍取数据。 */
            if (/^\s*export\s/m.test(s)) { console.error("::error::js/library.public.js 不能是 ES module：它是 index.html 用 <script src> 直接加载的普通脚本"); process.exit(1); }
            const ctx = { console: console, module: { exports: {} } };
            ctx.window = ctx; ctx.globalThis = ctx;
            vm.createContext(ctx);
            try { vm.runInContext(s, ctx); } catch (e) { console.error("::error::js/library.public.js 无法作为脚本加载：" + e.message); process.exit(1); }
            const lib = ctx.SOUP_LIBRARY;
            if (!Array.isArray(lib)) { console.error("::error::js/library.public.js 未导出 SOUP_LIBRARY 数组"); process.exit(1); }
            /* 直接数真实数据，不再用正则去猜 JSON 的排版（曾因产物重排把空格写法漏掉而误报） */
            const n = lib.length;
            const t = lib.filter(function (p) { return p && typeof p.truth === "string" && p.truth.trim() && p.mode !== "surface"; }).length;
            /* 阈值留余量：2026-09-25 清洗（去污染/去OCR重复）后题库约 870 题，瘦到 800 以下才算异常 */
            if (n < 800) { console.error("::error::js/library.public.js 题量异常：" + n); process.exit(1); }
            if (t < 800) { console.error("::error::js/library.public.js 汤底缺失：只有 " + t + " 条带底（单人模式会退化成空底瞎编）"); process.exit(1); }
            console.log("✓ js/library.public.js 结构正常（" + n + " 条，含汤底 " + t + " 条，明文公开）");
          '

      - name: 汤底污染防回归
        run: node tools/check_truth_pollution.js
